<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% if page.title %}{{ page.title }} | {{ site.title }}{% else %}{{ site.title }}{% endif %}</title>
    <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
    <link rel="icon" href="{{ '/favicon.ico' | relative_url }}" type="image/x-icon">
    <link rel="apple-touch-icon" href="{{ '/apple-touch-icon.png' | relative_url }}">
    {% seo %}
</head>
<body class="flex flex-col min-h-full">
    <header class="fixed top-0 w-full bg-white/80 dark:bg-black/80 backdrop-blur-sm z-[100] border-b border-gray-200 dark:border-gray-800">
        <nav class="max-w-5xl mx-auto px-4 sm:px-6 h-16 flex items-center justify-between">
            <a href="{{ '/' | relative_url }}" class="text-xl font-semibold">{{ site.title }}</a>
            <div class="flex items-center gap-6">
                <a href="{{ '/software' | relative_url }}" class="hover:text-blue-600 dark:hover:text-blue-400">Projects</a>
                <a href="{{ '/tools' | relative_url }}" class="hover:text-blue-600 dark:hover:text-blue-400">Tools</a>
                <a href="{{ '/photography' | relative_url }}" class="hover:text-blue-600 dark:hover:text-blue-400">Photos</a>
            </div>
        </nav>
    </header>

    <main class="pt-16">
        {{ content }}
    </main>

    <footer class="mt-auto border-t border-gray-200 dark:border-gray-800">
        <div class="max-w-5xl mx-auto px-4 sm:px-6 py-8">
            <div class="flex flex-col items-center gap-4">
                <div class="flex items-center gap-6">
                    <a href="https://github.com/irbox" target="_blank" rel="noopener noreferrer" class="text-gray-600 hover:text-gray-900 dark:text-gray-400 dark:hover:text-gray-200">
                        <i class="fab fa-github w-6 h-6"></i>
                    </a>
                    <!-- Add other social links as needed -->
                </div>
                <p class="text-sm text-gray-500 dark:text-gray-400">
                    {{ site.time | date: '%Y' }} {{ site.title }}. All rights reserved.
                </p>
            </div>
        </div>
    </footer>

    <script src="https://kit.fontawesome.com/your-kit-code.js"></script>
</body>
</html>
